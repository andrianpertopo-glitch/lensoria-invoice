:root{--ink:#102334;--nav:#111d2b;--nav2:#162739;--blue:#24afe5;--blue2:#0879af;--pale:#e9f7fc;--canvas:#f5f7fa;--card:#fff;--line:#e4eaf0;--sub:#778596;--green:#087e66;--red:#cf4750;--orange:#bf7710;--shadow:0 9px 34px rgba(20,42,61,.045);--radius:16px;font-synthesis:none}

function mergeLegacyData(incoming){
  // Merge in imported archives without changing the operator's current company settings or existing transactions.
  const existingNumbers=new Set(db.invoices.map(x=>String(x.number||'').toLowerCase()));
  const starterNames=['Live Streaming Multi Camera','Dokumentasi Foto & Video','Photobooth Event','Sewa Kamera','Sewa Tripod Video','Sewa Kabel HDMI 50 Meter','Operator Kamera'];
  const removeStarterCatalog=db.invoices.length===0&&db.catalog.length===starterNames.length&&db.catalog.every(c=>val(c.price)===0&&starterNames.includes(c.name));
  if(removeStarterCatalog)db.catalog=[];
  const customerIdMap=new Map();
  let addedCustomers=0,addedInvoices=0,addedPayments=0,addedCatalog=0,skipped=0;
  for(const c of incoming.customers){
    const hit=db.customers.find(x=>String(x.name||'').trim().toLowerCase()===String(c.name||'').trim().toLowerCase());
    if(hit){customerIdMap.set(c.id,hit.id);if(!hit.phone&&c.phone)hit.phone=c.phone;if(!hit.email&&c.email)hit.email=c.email;if(!hit.address&&c.address)hit.address=c.address;}
    else {const id=db.customers.some(x=>x.id===c.id)?uid():c.id;db.customers.push({...c,id});customerIdMap.set(c.id,id);addedCustomers++;}
  }
  const newlyAddedIds=new Set();
  for(const x of incoming.invoices){
    if(existingNumbers.has(String(x.number||'').toLowerCase())){skipped++;continue;}
    const id=db.invoices.some(i=>i.id===x.id)?uid():x.id;
    db.invoices.push({...x,id,customerId:customerIdMap.get(x.customerId)||''});
    existingNumbers.add(String(x.number||'').toLowerCase());newlyAddedIds.add(x.id);
    addedInvoices++;
  }
  const translatedInvoiceIds=new Map();
  for(const x of incoming.invoices){const match=db.invoices.find(a=>a.number===x.number);if(match&&newlyAddedIds.has(x.id))translatedInvoiceIds.set(x.id,match.id);}
  for(const pm of incoming.payments){
    if(!translatedInvoiceIds.has(pm.invoiceId))continue;
    if(db.payments.some(z=>z.id===pm.id))continue;
    db.payments.push({...pm,invoiceId:translatedInvoiceIds.get(pm.invoiceId)});addedPayments++;
  }
  for(const c of incoming.catalog){
    const key=String(c.name||'').trim().toLowerCase()+'|'+String(c.price||0)+'|'+String(c.unit||'').toLowerCase();
    const found=db.catalog.some(x=>[String(x.name||'').trim().toLowerCase(),String(x.price||0),String(x.unit||'').toLowerCase()].join('|')===key);
    if(!found){db.catalog.push({...c,id:db.catalog.some(x=>x.id===c.id)?uid():c.id});addedCatalog++;}
  }
  db.settings.nextNumber=Math.max(val(db.settings.nextNumber),val(incoming.settings?.nextNumber));
  if(!persist())return;
  nav('dashboard');
  toast(`Arsip digabung: ${addedInvoices} invoice, ${addedCustomers} pelanggan, ${addedCatalog} katalog, ${addedPayments} pembayaran. ${skipped} invoice sama dilewati.`);
}
async function backupRestore(file){try{const text=await file.text();const p=JSON.parse(text);if(!p||!Array.isArray(p.invoices)||!Array.isArray(p.payments)||!Array.isArray(p.catalog)||!Array.isArray(p.customers)||!p.settings)throw Error('Struktur data tidak dikenal.');if(p.importInfo?.version==='V1.1 arsip'){if(!confirm(`Gabungkan arsip ke data yang ada?\n${p.invoices.length} invoice, ${p.customers.length} pelanggan, ${p.payments.length} pembayaran. Invoice dengan nomor sama akan dilewati, data sekarang tidak dihapus.`))return;mergeLegacyData(p);return;}if(!confirm(`Ganti seluruh data pada browser ini dengan backup?\nInvoice: ${p.invoices.length}, pembayaran: ${p.payments.length}.`))return;db={...p,settings:{...seed().settings,...p.settings}};persist();nav('dashboard');toast('Backup berhasil dipulihkan.')}catch(e){toast('Gagal import: '+e.message,true)}}

function invoicePaper(x){const s=db.settings,t=invoiceTotals(x),paid=t.paid;const term=String(x.terms||'').trim();return `<article class="paper"><header class="paper-header"><div class="paper-header-top"><img src="${document.querySelector('.side-brand img')?.src || ''}" alt="Logo Lensoria Project"><div><div class="paper-doc-type">INVOICE</div><div class="paper-doc-sub">LENSORIA PROJECT</div></div></div></header><div class="ribbon"></div>
<div class="paper-body"><div class="paper-titlebar"><div><div class="paper-eyebrow">DITAGIHKAN KEPADA / BILL TO</div><p class="paper-customer">${E(x.customerName)}</p><div class="paper-contact">${E(x.customerPhone||'')}${x.customerEmail?`\n${E(x.customerEmail)}`:''}${x.customerAddress?`\n${E(x.customerAddress)}`:''}</div></div><div class="paper-meta"><span>INVOICE #</span><strong>${E(x.number)}</strong><span>TANGGAL</span><strong>${prettyDate(x.date)}</strong><span>JATUH TEMPO</span><strong>${prettyDate(x.dueDate)}</strong><span>MATA UANG</span><strong>IDR</strong></div></div>
${x.eventDate||x.eventLocation?`<div class="paper-event"><div><div class="event-k">Tanggal Acara / Sewa</div><div class="event-v">${prettyDate(x.eventDate)}</div></div><div><div class="event-k">Lokasi</div><div class="event-v">${E(x.eventLocation||'—')}</div></div></div>`:''}
<table class="paper-table"><thead><tr><th style="width:5%">NO</th><th>DESKRIPSI</th><th style="width:12%">QTY</th><th style="width:12%">DURASI</th><th style="width:17%">HARGA</th><th style="width:20%">JUMLAH</th></tr></thead><tbody>${x.items.map((it,i)=>`<tr><td>${i+1}</td><td><strong>${E(it.description)}</strong><small>${E(it.category)}${it.unit?' • '+E(it.unit):''}</small></td><td>${E(it.qty)}</td><td>${E(it.duration)}</td><td>${money(it.price)}</td><td class="amount">${money(val(it.qty)*val(it.duration)*val(it.price))}</td></tr>`).join('')}</tbody></table>
<div class="paper-bottom"><div>${paymentMethods()}</div><div class="paper-totals"><div class="paper-total-line"><span>Subtotal</span><strong>${money(t.subtotal)}</strong></div>${t.discount?`<div class="paper-total-line"><span>Diskon</span><strong>− ${money(t.discount)}</strong></div>`:''}${t.shipping?`<div class="paper-total-line"><span>Transport / Lainnya</span><strong>${money(t.shipping)}</strong></div>`:''}${val(x.taxRate)?`<div class="paper-total-line"><span>Pajak (${E(x.taxRate)}%)</span><strong>${money(t.tax)}</strong></div>`:''}<div class="paper-total-line paper-total-grand"><span>TOTAL</span><strong>${money(t.total)}</strong></div><div class="paper-total-line"><span>Sudah dibayar</span><strong>${x.legacyReview||x.legacyPaidNoLedger?'Tidak terinci di arsip':money(paid)}</strong></div><div class="paper-balance"><span>SISA TAGIHAN</span><strong>${x.legacyReview?'Belum diverifikasi':x.legacyPaidNoLedger?'Lunas (arsip; tanpa rincian)':money(t.due)}</strong></div></div></div>
${x.notes?`<div class="paper-notes"><strong>Catatan:</strong> ${E(x.notes)}</div>`:''}
<div class="paper-terms"><h3>Syarat dan Ketentuan</h3><p>${E(term)}</p></div></div>
<div class="paper-footer"><span>${E(s.name)} · ${E(s.address)} · ${E(s.phone)} · ${E(s.email)}</span><span>POWERED BY <b>LENSORIA</b></span></div></article>`;}
function receiptPaper(p){const x=getInvoice(p.invoiceId);if(!x)return '';const s=db.settings;const paidToDate=db.payments.filter(q=>q.invoiceId===x.id&&(q.date<p.date||(q.date===p.date&&(q.createdAt||'')<=(p.createdAt||'')))).reduce((a,q)=>a+val(q.amount),0);const t=invoiceTotals(x);return `<article class="paper"><header class="paper-header"><div class="paper-header-top"><img src="${document.querySelector('.side-brand img')?.src || ''}" alt="Logo Lensoria Project"><div><div class="paper-doc-type">KUITANSI</div><div class="paper-doc-sub">BUKTI PEMBAYARAN</div></div></div></header><div class="ribbon"></div>
<div class="paper-body"><div class="paper-titlebar"><div><div class="paper-eyebrow">DITERIMA DARI</div><p class="paper-customer">${E(x.customerName)}</p><div class="paper-contact">${E(x.customerPhone||'')}<br>${E(x.customerAddress||'')}</div></div><div class="paper-meta"><span>INVOICE #</span><strong>${E(x.number)}</strong><span>TANGGAL BAYAR</span><strong>${prettyDate(p.date)}</strong><span>TIPE</span><strong>${E(p.type||'Pembayaran')}</strong><span>METODE</span><strong>${E(p.method)}</strong></div></div>
<div class="receipt-amount"><small>JUMLAH DITERIMA</small><strong>${money(p.amount)}</strong></div>
<div class="receipt-grid"><div>Jenis pembayaran</div><div>${E(p.type||'Pembayaran')}</div><div>Untuk invoice</div><div>${E(x.number)} — ${E(x.type)}</div><div>Nilai tagihan</div><div>${money(t.total)}</div><div>Akumulasi dibayar</div><div>${money(paidToDate)}</div><div>Saldo saat ini</div><div>${money(t.due)}</div><div>Referensi / Catatan</div><div>${E(p.note||'—')}</div></div>
<div class="receipt-stamp">PEMBAYARAN DITERIMA</div>
<div class="paper-terms"><h3>Catatan</h3><p>Kuitansi ini adalah bukti pencatatan pembayaran di sistem Lensoria Project. Pastikan transaksi telah diverifikasi sebelum dibagikan kepada pelanggan.</p></div></div><div class="paper-footer"><span>${E(s.name)} · ${E(s.phone)} · ${E(s.email)}</span><span>POWERED BY <b>LENSORIA</b></span></div></article>`;}
function openPreview(html){const wrap=document.getElementById('preview-overlay');document.getElementById('preview-document').innerHTML=html;wrap.classList.add('open');wrap.setAttribute('aria-hidden','false');wrap.scrollTop=0;}
function closePreview(){const wrap=document.getElementById('preview-overlay');wrap.classList.remove('open');wrap.setAttribute('aria-hidden','true');document.getElementById('preview-document').innerHTML='';}
function previewInvoice(id){const x=getInvoice(id);if(!x){toast('Invoice tidak tersedia.',true);return}openPreview(invoicePaper(x))}
function previewReceipt(id){const p=db.payments.find(x=>x.id===id);if(!p){toast('Pembayaran tidak ditemukan.',true);return}openPreview(receiptPaper(p))}
function invoiceToolsDialog(id){const x=getInvoice(id);if(!x)return;const msg=`<div class="hint-box">Invoice: <strong>${E(x.number)}</strong><br>Pelanggan: ${E(x.customerName)}<br>Total: ${money(invoiceTotals(x).total)}<br>Status: ${E(invoiceStatus(x))}</div><div style="display:grid;gap:9px;margin-top:17px">${x.legacyReview?`<div class="hint-box" style="margin-bottom:10px">Arsip tanpa rincian pembayaran — periksa mutasi bank / kuitansi dulu.</div><button class="button button-soft" data-action="archive-confirm-unpaid" data-id="${E(id)}">Verifikasi: masih ada tagihan</button><button class="button button-soft" data-action="archive-confirm-paid" data-id="${E(id)}">Verifikasi: sudah lunas (tanpa rincian transfer)</button>`:''}<button class="button button-soft" data-action="duplicate-invoice" data-id="${E(id)}">${svg('copy')} Duplikat jadi invoice baru</button><button class="button button-soft" data-action="invoice-whatsapp" data-id="${E(id)}">${svg('phone')} Kirim pesan WhatsApp</button><button class="button button-danger" data-action="delete-invoice" data-id="${E(id)}">${svg('trash')} Hapus invoice</button></div><p class="form-note">Pesan WhatsApp hanya berupa teks ringkasan. File PDF tetap perlu dilampirkan sendiri.</p>`;openDialog('Opsi invoice',msg)}
function reconcileArchive(id,target){const x=getInvoice(id);if(!x||!x.legacyReview)return;const prompt=target==='paid'?'Konfirmasi arsip ini lunas berdasarkan pemeriksaan Anda? Pembayaran tanpa rincian TIDAK dihitung sebagai kas masuk.':'Konfirmasi arsip ini masih mempunyai tagihan yang belum dibayar? Nominalnya akan masuk perhitungan piutang.';if(!confirm(prompt))return;x.legacyReview=false;x.legacyPaidNoLedger=target==='paid';x.archiveVerifiedAt=new Date().toISOString();if(!persist())return;closeDialog();render();toast('Status arsip diperbarui.');}
function toIndoPhone(p){let digits=String(p||'').replace(/\D/g,'');if(digits.startsWith('0'))digits='62'+digits.slice(1);return digits;}
function shareInvoiceWhatsApp(id){const x=getInvoice(id);if(!x)return;const phone=toIndoPhone(x.customerPhone);if(!phone){toast('Nomor WhatsApp pelanggan belum diisi.',true);return}const t=invoiceTotals(x);const s=db.settings;const text=`Halo ${x.customerName}, berikut informasi invoice dari ${s.name}.\n\nInvoice: ${x.number}\nTanggal: ${prettyDate(x.date)}\nTotal: ${money(t.total)}\nSudah dibayar: ${money(t.paid)}\nSisa pembayaran: ${money(t.due)}\nJatuh tempo: ${prettyDate(x.dueDate)}\n\nMohon konfirmasi jika sudah melakukan pembayaran. Terima kasih.\n\n*File invoice PDF dikirim terpisah.*`;window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`,'_blank','noopener');}
function deleteInvoice(id){const x=getInvoice(id);if(!x)return;const payments=db.payments.filter(p=>p.invoiceId===id);if(payments.length){toast('Invoice memiliki pembayaran. Hapus riwayat pembayarannya terlebih dahulu.',true);return}if(!confirm(`Hapus invoice ${x.number}? Tindakan ini tidak bisa dibatalkan.`))return;db.invoices=db.invoices.filter(i=>i.id!==id);persist();closeDialog();render();toast('Invoice dihapus.');}
function deletePayment(id){const x=db.payments.find(p=>p.id===id);if(!x)return;if(!confirm(`Hapus catatan pembayaran ${money(x.amount)}? Saldo invoice akan berubah.`))return;db.payments=db.payments.filter(p=>p.id!==id);persist();render();toast('Catatan pembayaran dihapus.');}
function deleteCatalog(id){const x=db.catalog.find(c=>c.id===id);if(!x||!confirm(`Hapus ${x.name} dari katalog? Invoice yang sudah terbit tidak terpengaruh.`))return;db.catalog=db.catalog.filter(c=>c.id!==id);persist();render();toast('Item katalog dihapus.');}
function deleteCustomer(id){const x=db.customers.find(c=>c.id===id);if(!x)return;if(db.invoices.some(i=>i.customerId===id)){toast('Pelanggan digunakan pada invoice. Edit datanya saja.',true);return}if(!confirm(`Hapus pelanggan ${x.name}?`))return;db.customers=db.customers.filter(c=>c.id!==id);persist();render();toast('Pelanggan dihapus.');}
function helpDialog(){openDialog('Cara memakai Lensoria Invoice',`<div style="line-height:1.75;color:#557084"><p><strong>1. Pengaturan:</strong> pastikan identitas usaha, metode pembayaran, dan ketentuan sudah benar.</p><p><strong>2. Katalog:</strong> isi harga jasa dan sewa alat. Harga katalog awal adalah contoh Rp0.</p><p><strong>3. Invoice:</strong> buat pesanan; masukkan qty, durasi, harga, diskon bila perlu. Data pelanggan otomatis tersimpan.</p><p><strong>4. Cetak:</strong> buka invoice → Cetak / Simpan PDF → pilih Save as PDF dari printer browser. Kirim PDF itu secara manual ke WhatsApp pelanggan.</p><p><strong>5. Pembayaran:</strong> catat DP/cicilan/pelunasan di menu Pembayaran. Status invoice dihitung otomatis. Kuitansi bisa dicetak per transaksi.</p><p><strong>6. Backup:</strong> menu Pengaturan → Download Backup JSON. Pulihkan melalui Import file JSON.</p><p><strong>7. GitHub Pages:</strong> unggah index.html, app.js, styles.css, dan folder assets ke root repository. Buka Settings → Pages → Deploy from a branch → main / (root).</p><div class="danger-box">Penting: GitHub Pages hanya meng-host aplikasi statis. Data saat ini hanya ada di localStorage browser. Belum ada login, sinkronisasi perangkat, atau proteksi akses untuk database pelanggan.</div></div>`);}
// Event delegation — the app is rendered from data and has no external JS dependencies.
document.addEventListener('click',ev=>{
  const navEl=ev.target.closest('[data-route]');if(navEl){ev.preventDefault();nav(navEl.dataset.route);return}
  const el=ev.target.closest('[data-action]');if(!el)return;
  ev.preventDefault();const act=el.dataset.action,id=el.dataset.id||'';
  switch(act){
   case 'new-invoice':beginInvoice();break;
   case 'go-invoices':case 'cancel-editor':nav('invoices');break;
   case 'edit-invoice':closeDialog();beginInvoice(id);break;
   case 'preview-invoice':previewInvoice(id);break;
   case 'preview-edit':if(ui.editingInvoice){syncEditor();openPreview(invoicePaper(ui.editor))}break;
   case 'more-invoice':invoiceToolsDialog(id);break;
   case 'archive-confirm-unpaid':reconcileArchive(id,'unpaid');break;
   case 'archive-confirm-paid':reconcileArchive(id,'paid');break;
   case 'duplicate-invoice':closeDialog();beginInvoice(id,true);break;
   case 'delete-invoice':deleteInvoice(id);break;
   case 'invoice-whatsapp':shareInvoiceWhatsApp(id);break;
   case 'payment-new':openPayment(id);break;
   case 'preview-receipt':previewReceipt(id);break;
   case 'delete-payment':deletePayment(id);break;
   case 'customer-new':customerDialog();break;
   case 'customer-edit':customerDialog(id);break;
   case 'customer-delete':deleteCustomer(id);break;
   case 'catalog-new':catalogDialog();break;
   case 'catalog-edit':catalogDialog(id);break;
   case 'catalog-delete':deleteCatalog(id);break;
   case 'add-row':syncEditor();ui.editor.items.push(newItem({category:ui.editor.type==='Sewa Alat'?'Sewa Alat':'Jasa',unit:ui.editor.type==='Sewa Alat'?'Hari':'Paket'}));render();break;
   case 'remove-row':syncEditor();if(ui.editor.items.length===1){toast('Minimal satu item diperlukan.',true);break}ui.editor.items=ui.editor.items.filter(it=>it.id!==id);render();break;
   case 'backup-export':backupExport();break;
   case 'show-help':helpDialog();break;
   case 'close-dialog':closeDialog();break;
   default:break;
  }
});
document.addEventListener('submit',ev=>{
  const form=ev.target;if(!['invoice-form','payment-form','customer-form','catalog-form','settings-form'].includes(form.id))return;ev.preventDefault();switch(form.id){case 'invoice-form':saveInvoice();break;case 'payment-form':savePayment(form);break;case 'customer-form':saveCustomer(form);break;case 'catalog-form':saveCatalog(form);break;case 'settings-form':saveSettings(form);break;}
});
let timer;
document.addEventListener('input',ev=>{
 const el=ev.target;if(el.closest('#invoice-form')&&(el.matches('[data-draft-field]')||el.matches('[data-item-field]'))){syncEditor();updateDraftSummary();return}
 if(el.id==='invoice-search'||el.id==='catalog-search'||el.id==='customer-search'){ui.search=el.value;const start=el.selectionStart;const id=el.id;const active=document.activeElement;const scroll=window.scrollY;const panel=document.getElementById('view');if(ui.route==='invoices')panel.innerHTML=invoicesView();else if(ui.route==='catalog')panel.innerHTML=catalogView();else if(ui.route==='customers')panel.innerHTML=customersView();const repl=document.getElementById(id);repl?.focus({preventScroll:true});try{repl?.setSelectionRange(start,start)}catch(e){}window.scrollTo(0,scroll);}
});
document.addEventListener('change',ev=>{
 const el=ev.target;
 if(el.id==='invoice-filter'){ui.filter=el.value;const p=document.getElementById('view');p.innerHTML=invoicesView();return}
 if(el.id==='catalog-pick'&&el.value){syncEditor();const it=db.catalog.find(c=>c.id===el.value);if(it){ui.editor.items.push(newItem({description:it.name,category:it.category,unit:it.unit,price:it.price}));render();}return}
 if(el.id==='saved-customer'&&el.value){syncEditor();const c=db.customers.find(x=>x.id===el.value);if(c){Object.assign(ui.editor,{customerId:c.id,customerName:c.name,customerPhone:c.phone||'',customerEmail:c.email||'',customerAddress:c.address||''});render()}return}
 if(el.id==='pay-select'){const inv=getInvoice(el.value);if(inv){const due=invoiceTotals(inv).due;const t=document.getElementById('pay-due-label');if(t)t.innerHTML=`Sisa tagihan: <strong>${money(due)}</strong>`;document.getElementById('pay-amount').value=Math.min(due,Math.round(invoiceTotals(inv).total*val(db.settings.defaultDepositPercent)/100))||due;}return}
 if(el.id==='restore-file'&&el.files?.length){backupRestore(el.files[0]);el.value=''}
});
document.getElementById('top-new').addEventListener('click',()=>beginInvoice());
document.getElementById('open-nav').addEventListener('click',()=>{document.getElementById('sidebar').classList.add('mobile-open');document.getElementById('nav-shade').hidden=false});
document.getElementById('close-nav').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('mobile-open');document.getElementById('nav-shade').hidden=true});
document.getElementById('nav-shade').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('mobile-open');document.getElementById('nav-shade').hidden=true});
document.getElementById('close-preview').addEventListener('click',closePreview);
document.getElementById('print-now').addEventListener('click',()=>window.print());
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closeDialog();closePreview();}});
document.getElementById('today-date').textContent=formatToday();
render();
})();

</script>
